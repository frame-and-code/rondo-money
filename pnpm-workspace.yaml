packages:
  - 'apps/*'
  - 'packages/*'
# pnpm blocks dependency build scripts by default; approve the ones we trust.
# - unrs-resolver: native import resolver for eslint-plugin-import-x (F0.2).
# - prisma / @prisma/*: Prisma 7 postinstall (schema/migration engine setup) (F0.4).
# - @swc/core: native compiler bindings used by the Nest build and Jest (F0.4).
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  prisma: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.62.0'
  - '@typescript-eslint/parser@8.62.0'
  - '@typescript-eslint/project-service@8.62.0'
  - '@typescript-eslint/scope-manager@8.62.0'
  - '@typescript-eslint/tsconfig-utils@8.62.0'
  - '@typescript-eslint/type-utils@8.62.0'
  - '@typescript-eslint/types@8.62.0'
  - '@typescript-eslint/typescript-estree@8.62.0'
  - '@typescript-eslint/utils@8.62.0'
  - '@typescript-eslint/visitor-keys@8.62.0'
  - eslint-plugin-import-x@4.17.0
  - globals@17.7.0
  - typescript-eslint@8.62.0
