packages:
  - 'apps/*'
  - 'packages/*'

# js-yaml 3.x reaches us only through Jest's tooling (jest-resolve-dependencies and
# friends), never through anything we ship: it parses our own configs, not untrusted
# input. Jest pins the major, so the advisories against 3.14.2 cannot be cleared by
# upgrading a direct dependency — the patched 3.15.1 has to be forced here. Scoped to the
# 3.x line so the separate js-yaml 4.x in the tree is left alone.
overrides:
  'js-yaml@3': ^3.15.1

# pnpm blocks dependency build scripts by default; approve the ones we trust.
# - unrs-resolver: native import resolver for eslint-plugin-import-x (F0.2).
# - prisma / @prisma/*: Prisma 7 postinstall (schema/migration engine setup) (F0.4).
# - @swc/core: native compiler bindings used by the Nest build and Jest (F0.4).
# - sharp: image codec used by Next.js; ships prebuilt @img/* binaries, the install
#   script only compiles a fallback when none match the platform (surfaced in CI, F0.9).
# - @clerk/shared: false — its postinstall only prints a telemetry notice (F1.1);
#   the package works without it, so don't run third-party code on install.
# - bufferutil / utf-8-validate: false — optional native speedups for ws (via
#   jsdom → jest); pure-JS fallbacks are fine for tests, skip the node-gyp builds.
allowBuilds:
  '@clerk/shared': false
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': true
  bufferutil: false
  prisma: true
  sharp: true
  unrs-resolver: true
  'utf-8-validate': false
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.62.0'
  - '@typescript-eslint/parser@8.62.0'
  - '@typescript-eslint/project-service@8.62.0'
  - '@typescript-eslint/scope-manager@8.62.0'
  - '@typescript-eslint/tsconfig-utils@8.62.0'
  - '@typescript-eslint/type-utils@8.62.0'
  - '@typescript-eslint/types@8.62.0'
  - '@typescript-eslint/typescript-estree@8.62.0'
  - '@typescript-eslint/utils@8.62.0'
  - '@typescript-eslint/visitor-keys@8.62.0'
  - eslint-plugin-import-x@4.17.0
  - globals@17.7.0
  - typescript-eslint@8.62.0
