# F1.12 — SonarQube Cloud analysis, run from CI (the `sonar` job in ci.yml).
# Automatic analysis does not support monorepos, so this file is the single source of the
# scanner configuration. One Sonar project covers the whole monorepo: at the current size,
# six per-workspace projects would add navigation, not signal.
#
# One setting deliberately does NOT live here: `sonar.qualitygate.wait`, which decides
# whether a failing quality gate fails the build. It depends on the event being analysed
# (pull request vs push to `main`), which a properties file cannot express, so the `sonar`
# job passes it on the scanner command line. The reasoning is written there.
sonar.projectKey=frame-and-code_rondo-money
sonar.organization=frame-and-code

# Directories are listed explicitly: `sonar.sources` and `sonar.tests` must not overlap,
# and an explicit list keeps generated and vendored code out by construction.
# packages/config holds only lint/format/tsconfig presets — nothing to analyse.
sonar.sources=apps/api/src,apps/web/src,packages/api-client/src,packages/db/src,packages/types/src,packages/ui/src
sonar.tests=apps/api/test,apps/web/test,apps/web/e2e,packages/api-client/test,packages/types/test

# Generated on every `db:generate` / `codegen`, or by the shadcn CLI into
# `packages/ui/src/components/ui` and `packages/ui/src/hooks` (see that package's README):
# not our code to review.
sonar.exclusions=packages/db/src/generated/**,packages/api-client/src/generated/**,packages/ui/src/components/ui/**,packages/ui/src/hooks/**

# Duplication, and only duplication: the three interface dictionaries are parallel by
# construction. Every key exists in ru, en and pl under the same name in the same order, which
# is what makes a missing translation a type error instead of a blank screen. A copy-paste
# detector reads that as copy-paste and fails the quality gate on any change that adds a
# string, so it does not read these three. Everything else is still checked, here and in the
# rest of the analysis: these files are excluded from duplication alone, not from the project.
sonar.cpd.exclusions=apps/web/src/i18n/messages/**

# Coverage is measured on code that can fail. A NestJS response class, a request DTO and a
# module are declarations: decorators and field names, no statement whose behaviour a test
# could pin. They still land in the coverage report, where their decorator metadata reads as
# uncovered lines and branches no test can reach, so they pull the measurement away from the
# code that carries logic. Excluded from coverage alone: they are still analysed for
# everything else. A file that grows a statement moves out of this list.
sonar.coverage.exclusions=apps/api/src/**/*.response.ts,apps/api/src/**/*.dto.ts,apps/api/src/**/*.module.ts

# Coverage: the sonar job runs the unit and integration tests first (jest configs keep
# coverage always on, with lcov paths rewritten to be repo-root-relative), then the
# scanner imports the lcov from here. A listed file that is missing is a warning, not a
# failure — resilient to a workspace temporarily having no tests.
#
# apps/api reports TWO files, one per test level, and both are needed: the levels cover
# different code (the unit run is the only one that reaches openapi/ and environment.ts, and
# the integration run covers the guard and the scoping extension far more deeply than the unit
# run does). One shared path lets a later run's
# lcov overwrite the earlier one, and the analysis then sees a single level.
# The scanner unions multiple reports for the same file.
sonar.javascript.lcov.reportPaths=apps/api/coverage/unit/lcov.info,apps/api/coverage/integration/lcov.info,apps/web/coverage/lcov.info,packages/api-client/coverage/lcov.info,packages/types/coverage/lcov.info
