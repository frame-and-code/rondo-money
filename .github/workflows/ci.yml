# F0.9 — CI-гейт: lint → typecheck → tests (unit → integration → e2e) на каждый PR.
# Один job = один required status check ("gate") для branch protection на main.
# Порядок шагов намеренно последовательный — это гейт, а не матрица.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Интеграция и e2e ходят в service-контейнер Postgres (аналог docker-compose из F0.3).
  # ConfigModule и prisma.config.ts читают process.env — .env-файлов в CI нет.
  DATABASE_URL: 'postgresql://ffai:ffai_ci_secret@localhost:5432/ffai_ci?schema=public'

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ffai
          POSTGRES_PASSWORD: ffai_ci_secret
          POSTGRES_DB: ffai_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ffai -d ffai_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Версию pnpm берёт из "packageManager" в package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Apply migrations
        run: pnpm --filter @ffai/db run db:deploy

      - name: Integration tests
        run: pnpm test:integration

      - name: Install Playwright Chromium
        run: pnpm --filter @ffai/web exec playwright install --with-deps chromium

      # Серверы (api + web) Playwright поднимает сам — см. apps/web/playwright.config.ts
      - name: E2E tests
        run: pnpm test:e2e

      # В CI репортер 'github' (аннотации в PR); артефакты падений — трейсы Playwright
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
