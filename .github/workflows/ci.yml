# F0.9 — CI-гейт: lint → typecheck → tests (unit → integration → e2e) на каждый PR.
# Один job = один required status check ("gate") для branch protection на main.
# Порядок шагов намеренно последовательный — это гейт, а не матрица.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Повторный push в PR отменяет устаревший ран; push в main не отменяем никогда —
# каждый коммит main должен быть провалидирован (зелёный main — предусловие F0.10).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Единственный источник креденшалов CI-Postgres: отсюда конфигурируется service-контейнер
  # и собирается DATABASE_URL (шаг Compose ниже). Не секрет: база живёт минуты внутри
  # раннера и снаружи недоступна.
  POSTGRES_USER: ffai
  POSTGRES_PASSWORD: ffai_ci_secret
  POSTGRES_DB: ffai_ci

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        # $-переменные в health-cmd разворачивает шелл внутри контейнера (docker CMD-SHELL),
        # где POSTGRES_* заданы через env выше — литералов тут нет.
        options: >-
          --health-cmd "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # Интеграция и e2e ходят в service-контейнер Postgres (аналог docker-compose из F0.3).
      # ConfigModule и prisma.config.ts читают process.env — .env-файлов в CI нет.
      # Контекст env недоступен в env воркфлоу и job (см. Context availability в доках),
      # поэтому URL собирается шагом: шелл видит POSTGRES_* как обычное окружение.
      - name: Compose DATABASE_URL
        run: >-
          echo "DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}?schema=public"
          >> "$GITHUB_ENV"

      # Экшены запинены по commit SHA (mutable-тег могут перенацелить); комментарий —
      # человекочитаемая версия, при бампе обновлять оба.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # Гейт после клонирования в git не ходит — не оставляем GITHUB_TOKEN в .git/config
          persist-credentials: false

      # Версию pnpm берёт из "packageManager" в package.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Apply migrations
        run: pnpm --filter @ffai/db run db:deploy

      - name: Integration tests
        run: pnpm test:integration

      - name: Install Playwright Chromium
        run: pnpm --filter @ffai/web exec playwright install --with-deps chromium

      # Серверы (api + web) Playwright поднимает сам — см. apps/web/playwright.config.ts
      - name: E2E tests
        run: pnpm test:e2e

      # В CI репортер 'github' (аннотации в PR); артефакты падений — трейсы Playwright
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
