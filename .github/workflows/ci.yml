name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  POSTGRES_USER: rondo
  POSTGRES_PASSWORD: rondo_ci_secret
  POSTGRES_DB: rondo_ci

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL -o "${RUNNER_TEMP}/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"

      - name: Scan the full history
        run: ./secret-scan.sh history

  static:
    name: Static checks (lint · format · types · contract)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Lint the agent setup
        run: pnpm lint:hooks

      - name: Check the documentation for drift
        run: pnpm lint:docs

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Contract drift check
        run: ./codegen.sh check

  build:
    name: Build (all packages)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  image:
    name: Web image boots and answers its healthcheck
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image Railway deploys
        run: |
          set -euo pipefail

          # Assembled rather than written out: a literal of this shape is a secret to
          # gitleaks, and an allowlist entry would teach the scanner to skip real ones.
          key="pk_test_$(printf 'ci-placeholder.clerk.accounts.dev$' | base64 | tr -d '\n')"

          docker build \
            --file apps/web/Dockerfile \
            --tag rondo-web:ci \
            --build-arg NEXT_PUBLIC_API_URL=https://api.example.invalid \
            --build-arg NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY="${key}" \
            .

      - name: Start the container
        run: >-
          docker run --detach --name rondo-web-ci --publish 3001:3001
          --env CLERK_SECRET_KEY=sk_test_ci_placeholder
          rondo-web:ci

      - name: Probe the path railway.json probes
        run: |
          set -euo pipefail

          code=000
          for attempt in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
              http://127.0.0.1:3001/api/health || true)
            if [ "${code}" = '200' ]; then
              echo "answered 200 on attempt ${attempt}"
              exit 0
            fi
            sleep 2
          done

          echo "::error::the image never answered 200 on /api/health (last status: ${code})"
          exit 1

      - name: Container logs
        if: always()
        run: docker logs rondo-web-ci || true

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test:unit

      - name: Hook, docs checker and CI script tests
        run: pnpm test:hooks

  integration:
    name: Integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Compose DATABASE_URL
        run: >-
          echo "DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}?schema=public"
          >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter @rondo/db run db:deploy

      - name: Integration tests
        run: pnpm test:integration

  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      has_clerk_keys: ${{ steps.probe.outputs.has_clerk_keys }}
      has_sonar_token: ${{ steps.probe.outputs.has_sonar_token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: probe
        env:
          HAS_CLERK_KEYS: ${{ secrets.CLERK_SECRET_KEY != '' && secrets.CLERK_JWT_KEY != '' && secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' }}
          HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          IS_DEPENDABOT: ${{ github.actor == 'dependabot[bot]' }}
        run: bash .github/scripts/preflight.sh

  e2e:
    name: E2E tests (Playwright)
    needs: preflight
    if: needs.preflight.outputs.has_clerk_keys == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Compose DATABASE_URL
        run: >-
          echo "DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}?schema=public"
          >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter @rondo/db run db:deploy

      - name: Restore the Next.js build cache
        id: next-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/web/src/**', 'packages/ui/src/**', 'packages/api-client/src/**') }}
          restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Resolve the Playwright version
        id: playwright
        run: >-
          echo "version=$(pnpm --filter @rondo/web exec playwright --version | awk '{print $2}')"
          >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browser cache
        id: playwright-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        timeout-minutes: 12
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = 'true' ]; then
            set -- install-deps chromium
          else
            set -- install --with-deps chromium
          fi

          for attempt in 1 2; do
            if timeout 300 pnpm --filter @rondo/web exec playwright "$@"; then
              exit 0
            fi

            echo "::warning::Playwright install attempt ${attempt} timed out or failed — retrying"

            sudo pkill -KILL -f apt-get || true
            sleep 5
          done

          exit 1

      - name: Save the Playwright browser cache
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: E2E tests
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_JWT_KEY: ${{ secrets.CLERK_JWT_KEY }}
          WEB_ORIGIN: http://localhost:3001

      - name: Save the Next.js build cache
        if: ${{ !cancelled() && steps.next-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: apps/web/test-results

  sonar:
    name: Sonar analysis
    needs: preflight
    if: needs.preflight.outputs.has_sonar_token == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Compose DATABASE_URL
        run: >-
          echo "DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}?schema=public"
          >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter @rondo/db run db:deploy

      - name: Unit tests with coverage
        run: pnpm test:unit

      - name: Integration tests with coverage
        run: pnpm test:integration

      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        with:
          args: -Dsonar.qualitygate.wait=${{ github.event_name == 'pull_request' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  gate:
    if: always()
    needs: [secrets, preflight, static, build, image, unit, integration, e2e, sonar]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Summarise the run and fail on any red job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          {
            echo "| Job | Result |"
            echo "| --- | ------ |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          while IFS=$'\t' read -r job result; do
            echo "| \`${job}\` | ${result} |" >> "$GITHUB_STEP_SUMMARY"
            case "${result}" in
              success | skipped) ;;
              *)
                echo "::error::${job} finished with: ${result}"
                failed=1
                ;;
            esac
          done < <(echo "${RESULTS}" | jq -r 'to_entries[] | "\(.key)\t\(.value.result)"')

          exit "${failed}"
