# F0.9 — CI gate: lint → typecheck → tests (unit → integration → e2e) on every PR.
# One job = one required status check ("gate") for branch protection on main.
# The step order is deliberately sequential — this is a gate, not a matrix.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# The gate only reads the repository: the token is needed by checkout alone. Artifacts (upload-artifact)
# and the Playwright github reporter annotations don't go through GITHUB_TOKEN — no scopes needed.
permissions:
  contents: read

# A repeated push to a PR cancels the stale run; pushes to main are never cancelled —
# every main commit must be validated (green main is a precondition of F0.10).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Single source of the CI Postgres credentials: it configures the service container
  # and DATABASE_URL is assembled from it (the Compose step below). Not a secret: the DB
  # lives for minutes inside the runner and is unreachable from outside.
  POSTGRES_USER: ffai
  POSTGRES_PASSWORD: ffai_ci_secret
  POSTGRES_DB: ffai_ci

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Are the Clerk dev-instance secrets available? GitHub hides secrets from fork PRs,
      # and the `secrets` context is forbidden in a step `if` (allowed only in env/with —
      # using it in `if` makes GitHub reject the whole workflow at parse time), so the
      # answer is materialized here as a job-level boolean the E2E step can gate on.
      # Job level, not workflow level: `secrets` is not allowed in workflow-level env either.
      HAS_CLERK_KEYS: ${{ secrets.CLERK_SECRET_KEY != '' && secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY != '' }}

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        ports:
          - 5432:5432
        # The $-variables in health-cmd are expanded by the shell inside the container (docker CMD-SHELL),
        # where POSTGRES_* are set via env above — no literals here.
        options: >-
          --health-cmd "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # Integration and e2e tests hit the Postgres service container (the docker-compose analog from F0.3).
      # ConfigModule and prisma.config.ts read process.env — there are no .env files in CI.
      # The env context is unavailable in workflow- and job-level env (see Context availability in the docs),
      # so the URL is assembled in a step: the shell sees POSTGRES_* as regular environment.
      - name: Compose DATABASE_URL
        run: >-
          echo "DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@localhost:5432/${POSTGRES_DB}?schema=public"
          >> "$GITHUB_ENV"

      # Actions are pinned by commit SHA (a mutable tag can be retargeted); the comment is
      # the human-readable version — update both on a bump.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # The gate never touches git after cloning — don't leave GITHUB_TOKEN in .git/config
          persist-credentials: false

      # Takes the pnpm version from "packageManager" in package.json
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Apply migrations
        run: pnpm --filter @ffai/db run db:deploy

      - name: Integration tests
        run: pnpm test:integration

      - name: Install Playwright Chromium
        run: pnpm --filter @ffai/web exec playwright install --with-deps chromium

      # Playwright starts the servers (api + web) itself — see apps/web/playwright.config.ts
      # Clerk (F1.1): dev-instance keys come from GitHub secrets (Settings → Secrets →
      # Actions); without them the web server can't serve at all (clerkMiddleware throws on
      # every request, Clerk's keyless mode is disabled in CI). GitHub does not expose
      # secrets to pull requests from forks, so the step is skipped there instead of
      # failing the whole gate deep inside Playwright global setup. The variables are
      # declared in the test:e2e task env in turbo.json — otherwise turbo strict env mode
      # strips them.
      - name: E2E tests
        if: env.HAS_CLERK_KEYS == 'true'
        run: pnpm test:e2e
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}

      # CI uses the 'github' reporter (PR annotations); failure artifacts are Playwright traces
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7
          if-no-files-found: ignore
