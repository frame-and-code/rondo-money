version: 2

updates:
  # pnpm workspace: one entry covers the root manifest and every workspace package —
  # Dependabot reads pnpm-workspace.yaml itself. "npm" is the ecosystem value for the
  # whole JS ecosystem (npm/pnpm/yarn); there is no "pnpm" value.
  # cooldown mirrors the pnpm minimum-release-age policy: without it Dependabot would
  # propose versions too fresh for `pnpm install --frozen-lockfile` to accept.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    cooldown:
      default-days: 7
    groups:
      prod-dependencies:
        dependency-type: 'production'
        update-types: ['minor', 'patch']
      dev-dependencies:
        dependency-type: 'development'
        update-types: ['minor', 'patch']

  # Actions in ci.yml are pinned by SHA with a version comment — Dependabot updates both.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(ci)'
    groups:
      # Only minor and patch are grouped; majors arrive as their own PR on a differently
      # named branch, which is what keeps them out of auto-merge (see dependabot-auto-merge.yml).
      actions:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # Base images (node:*-slim) in both Dockerfiles. Bumping them is a major runtime change:
  # keep it in sync with `node-version` in ci.yml and .nvmrc.
  - package-ecosystem: 'docker'
    directories:
      - '/apps/api'
      - '/apps/web'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'chore(docker)'
